<!doctype html>
<html class="spike-document"><head class="spike-head"><meta class="spike-charset" charset="utf-8"><meta class="spike-viewport" name="viewport" content="width=device-width,initial-scale=1"><title class="spike-title">Touch test</title>
<style class="spike-style">body{margin:0;padding:24px;background:#18191d;color:white;font:20px sans-serif} .touch-target{height:45vh;background:#666;display:grid;place-items:center;touch-action:pan-y} .touch-target.is-hit{background:#22a75a} .touch-log{height:35vh;overflow:auto;white-space:pre-wrap;font-size:14px}</style></head>
<body class="spike-body"><h1 class="spike-heading">Pointer event test</h1><div class="touch-target">Clean tap here</div><pre class="touch-log" aria-live="polite"></pre><script class="spike-script" type="module">
import {createTapDetector} from './js/tap.js';
const detector=createTapDetector(),target=document.querySelector('.touch-target'),log=document.querySelector('.touch-log');
for(const type of ['pointerdown','pointermove','pointerup','pointercancel'])document.addEventListener(type,e=>{
 log.textContent=JSON.stringify({event:type,pointerType:e.pointerType,pointerId:e.pointerId,x:e.clientX,y:e.clientY})+'\n'+log.textContent.slice(0,12000);
 const row=e.target.closest('.touch-target');
 if(type==='pointerdown')detector.down(e.pointerId,e.clientX,e.clientY,e.timeStamp,row);
 if(type==='pointermove')detector.move(e.pointerId,e.clientX,e.clientY);
 if(type==='pointercancel')detector.cancel(e.pointerId);
 if(type==='pointerup'&&detector.up(e.pointerId,e.clientX,e.clientY,e.timeStamp,row)){target.classList.add('is-hit');setTimeout(()=>target.classList.remove('is-hit'),400);}
});
</script></body></html>
